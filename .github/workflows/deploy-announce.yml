name: Announce the deploy result

# Joins the existing CI/CD workflow instead of duplicating it: the deploy
# itself is still the `deploy-prod` job of ci-cd.yml. This workflow only waits
# for that job to finish and reports the outcome to the notification relay.
#
# The relay lives on docker-alma behind erp.beautyworld.id, which is where the
# Discord webhook URL is kept. This repository therefore needs one rotatable
# secret (NOTIFY_RELAY_TOKEN) and never holds the channel webhook.

on:
  workflow_run:
    workflows: ['ProgramingLive CI/CD']
    types: [requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RELAY_URL: https://erp.beautyworld.id/api/discord

jobs:
  announce:
    name: Announce deploy result
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Wait for the deploy job
        id: wait
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            if (!run) {
              core.notice('Manual run: nothing to wait for.')
              return
            }
            // ci-cd.yml names the job `deploy-production`. Match that string, not
            // a guess: a wrong name meant this step polled for 40 minutes and
            // always reported `timed_out`.
            const DEPLOY_JOB = 'deploy-production'
            const deadline = Date.now() + 45 * 60 * 1000
            let conclusion = 'timed_out'
            while (Date.now() < deadline) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              })
              const deploy = jobs.data.jobs.find((j) => j.name === DEPLOY_JOB || j.name.startsWith(`${DEPLOY_JOB} `))
              if (deploy && deploy.status === 'completed') {
                conclusion = deploy.conclusion
                break
              }
              await new Promise((r) => setTimeout(r, 30000))
            }
            core.setOutput('conclusion', conclusion)
            core.setOutput('head_sha', run.head_sha.slice(0, 7))
            core.setOutput('run_url', run.html_url)

      - name: Skip when this run deployed nothing
        id: gate
        env:
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        run: |
          # Untagged pushes never deploy: ci-cd.yml only deploys on v* tags or a
          # manual dispatch. Announcing "deploy gagal" for those would be a lie.
          if [[ "${CONCLUSION}" == "timed_out" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No deploy job finished; nothing to announce."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to the relay
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          RELAY_TOKEN: ${{ secrets.NOTIFY_RELAY_TOKEN }}
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
          HEAD: ${{ steps.wait.outputs.head_sha }}
          RUN_URL: ${{ steps.wait.outputs.run_url }}
        run: |
          set -euo pipefail
          if [[ -z "${RELAY_TOKEN:-}" ]]; then
            echo "::notice::NOTIFY_RELAY_TOKEN is not configured; deploy result not announced."
            exit 0
          fi
          if [[ "${CONCLUSION}" == "success" ]]; then
            COLOR=ok
            TITLE="🟢 ${GITHUB_REPOSITORY} terkirim ke produksi"
          else
            COLOR=fail
            TITLE="🔴 ${GITHUB_REPOSITORY} deploy gagal (${CONCLUSION})"
          fi
          DESCRIPTION="Commit \`${HEAD}\` · ${CONCLUSION}
          ${RUN_URL:-}"
          # jq builds the JSON so a quote or newline in the description cannot
          # break the payload.
          PAYLOAD=$(jq -nc --arg t "$TITLE" --arg d "$DESCRIPTION" --arg c "$COLOR" \
            '{content: ("**" + $t + "**\n" + $d)}')
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Gitlab-Token: ${RELAY_TOKEN}" \
            --data "$PAYLOAD" \
            "${RELAY_URL}"
