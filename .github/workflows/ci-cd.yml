name: ProgramingLive CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the selected ref to Netlify production after checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    # Standard checks from programinglive/ci-cd. One caller replaces the
    # previous hand-written test and build steps.
    name: Test and build
    uses: programinglive/ci-cd/.github/workflows/ci-node.yml@v1
    with:
      node-version: "20"
      build-command: npm run build
      # Ubuntu-hosted until the self-hosted bw-tools runner is installed.
      # The bw-tools runner needs an organisation registration token; switch
      # this line to '["self-hosted","linux","bw-tools"]' afterwards.
      runner: '["ubuntu-latest"]'

  deploy-production:
    name: Deploy release to Netlify production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://programinglive.com
    concurrency:
      group: programinglive-netlify-production
      cancel-in-progress: false
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Deploy tagged release
        run: npx --yes netlify-cli@27.10.1 deploy --prod --build --site "$NETLIFY_SITE_ID" --message "Release ${GITHUB_REF_NAME}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
