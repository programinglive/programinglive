name: Publish development bulletin

on:
  push:
    branches: [main]
    paths:
      - data/development-progress.json
      - scripts/post-development-bulletin.cjs
      - .github/workflows/development-bulletin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Post roadmap progress to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Discord configuration
        id: discord
        shell: bash
        env:
          BULLETIN_RELAY_TOKEN: ${{ secrets.NOTIFY_RELAY_TOKEN }}
        run: |
          # The relay is the normal path; the channel webhook is only a fallback
          # for a local run. Either one counts as configured.
          if [[ -n "${BULLETIN_RELAY_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bulletin skipped: NOTIFY_RELAY_TOKEN is not configured."
          fi

      - name: Publish bulletin
        if: steps.discord.outputs.configured == 'true'
        run: node scripts/post-development-bulletin.cjs
        env:
          # DOCS/DISCORD-BULLETIN.md: the relay keeps the webhook URL on the
          # notification server; the workflow only carries a token.
          BULLETIN_WEBHOOK_URL: https://erp.beautyworld.id/api/discord
          BULLETIN_RELAY_TOKEN: ${{ secrets.NOTIFY_RELAY_TOKEN }}
